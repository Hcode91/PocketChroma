name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Core smoke test (desktop)
        run: |
          g++ -std=c++17 -O2 -Wall -Wno-unused-but-set-variable -o headless tools/headless.cpp core/*.cpp
          head -c 8192 /dev/zero > zero_bios.bin
          head -c 1048576 /dev/zero > zero_cart.bin
          ./headless zero_bios.bin zero_cart.bin 30

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK + CMake (preinstalled SDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        run: gradle --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: PocketChroma-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
