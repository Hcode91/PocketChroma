name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Core smoke test (desktop)
        run: |
          g++ -std=c++17 -O2 -Wall -Wno-unused-but-set-variable -o headless tools/headless.cpp core/*.cpp
          head -c 8192 /dev/zero > zero_bios.bin
          head -c 1048576 /dev/zero > zero_cart.bin
          ./headless zero_bios.bin zero_cart.bin 30

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        run: gradle --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: PocketChroma-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
